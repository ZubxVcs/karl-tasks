{% extends "view/base.html" %}

{% block content %}
<div class="calendar-layout-container">
  <!-- Monthly Calendar Card -->
  <div class="calendar-card">
    <div class="calendar-top">
      <div class="cal-header-date" id="cal-month-year">November 2026</div>
      <div style="display: flex; gap: 6px;">
        <button class="cal-nav-btn" onclick="navMonth(-1)">‹</button>
        <button class="cal-nav-btn" onclick="navMonth(1)">›</button>
      </div>
    </div>

    <div class="weekdays-row">
      <div class="weekday-item is-sunday">Min</div>
      <div class="weekday-item">Sen</div>
      <div class="weekday-item">Sel</div>
      <div class="weekday-item">Rab</div>
      <div class="weekday-item">Kam</div>
      <div class="weekday-item">Jum</div>
      <div class="weekday-item">Sab</div>
    </div>

    <div class="days-grid" id="days-grid"></div>
  </div>

  <!-- Timeline Schedule of Selected Day -->
  <div class="timeline-card">
    <div class="timeline-head">
      <h3 class="section-title" id="timeline-title" style="font-size: 1.05rem;">Jadwal Hari Ini</h3>
    </div>
    <div class="timeline-list" id="timeline-list"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  let allTasks = [];
  const now = new Date();
  let currentYear = now.getFullYear();
  let currentMonth = now.getMonth();
  let selectedDateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

  const monthNames = [
    'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
  ];

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatHumanDate(dateStr) {
    if (!dateStr) return 'Tanpa batas';
    try {
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        const day = parseInt(parts[2], 10);
        const mIdx = parseInt(parts[1], 10) - 1;
        return `${day} ${monthNames[mIdx] || ''} ${parts[0]}`;
      }
      return dateStr;
    } catch (e) {
      return dateStr;
    }
  }

  let holidaysMap = {};

  async function loadHolidays(year) {
    try {
      const res = await fetch(`/api/holidays?year=${year}`);
      holidaysMap = await res.json();
      renderCalendar();
      renderTimeline();
    } catch (e) {
      console.error('Error loading holidays:', e);
    }
  }

  async function reloadPageData() {
    try {
      const res = await fetch('/api/todos');
      allTasks = await res.json();
      await loadHolidays(currentYear);
    } catch (e) {
      console.error('Error loading calendar:', e);
    }
  }

  function renderCalendar() {
    const monthYearEl = document.getElementById('cal-month-year');
    if (monthYearEl) {
      monthYearEl.innerText = `${monthNames[currentMonth]} ${currentYear}`;
    }
    const grid = document.getElementById('days-grid');
    if (!grid) return;
    grid.innerHTML = '';

    const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
    const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

    for (let i = 0; i < firstDayIndex; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      empty.style.pointerEvents = 'none';
      grid.appendChild(empty);
    }

    for (let day = 1; day <= totalDays; day++) {
      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const dayOfWeek = new Date(currentYear, currentMonth, day).getDay();
      const isSunday = dayOfWeek === 0;
      const holidayName = holidaysMap[dateStr];
      const isRedDate = isSunday || !!holidayName;

      const hasEvent = allTasks.some(t => t.deadline === dateStr);
      const isSelected = dateStr === selectedDateStr;

      const cell = document.createElement('div');
      cell.className = `day-cell ${isSelected ? 'selected' : ''} ${hasEvent ? 'has-event' : ''} ${isRedDate ? 'is-holiday' : ''}`;
      cell.innerText = day;
      if (holidayName) {
        cell.title = holidayName;
      }
      cell.onclick = () => selectDate(dateStr);
      grid.appendChild(cell);
    }
  }

  window.navMonth = function(delta) {
    const prevYear = currentYear;
    currentMonth += delta;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentYear !== prevYear) {
      loadHolidays(currentYear);
    } else {
      renderCalendar();
    }
  };

  window.selectDate = function(dateStr) {
    selectedDateStr = dateStr;
    renderCalendar();
    renderTimeline();
  };

  function renderTimeline() {
    const container = document.getElementById('timeline-list');
    const titleEl = document.getElementById('timeline-title');
    if (!container || !titleEl) return;
    
    const dayTasks = allTasks.filter(t => t.deadline === selectedDateStr);
    const holidayNotice = holidaysMap[selectedDateStr] ? `<div class="holiday-tag-sub">🔴 ${escapeHtml(holidaysMap[selectedDateStr])}</div>` : '';
    titleEl.innerHTML = (selectedDateStr === `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}` ? "Jadwal Hari Ini" : `Jadwal (${formatHumanDate(selectedDateStr)})`) + holidayNotice;

    const iconMap = {
      'Kuliah': '<i class="ph ph-graduation-cap"></i>',
      'Homelab': '<i class="ph ph-hard-drives"></i>',
      'Coding': '<i class="ph ph-code"></i>',
      'Umum': '<i class="ph ph-pin"></i>'
    };

    if (dayTasks.length === 0) {
      container.innerHTML = `
        <div style="text-align: center; padding: 24px; color: var(--text-muted); font-size: 0.88rem;">
          Tidak ada agenda / tugas di tanggal ini.
        </div>
      `;
      return;
    }

    container.innerHTML = dayTasks.map(t => `
      <div class="timeline-item">
        <div class="timeline-icon-box">${iconMap[t.category] || '📌'}</div>
        <div class="timeline-info">
          <span class="timeline-meta">${t.category} • Prioritas: ${t.priority}</span>
          <div class="timeline-task-title">${escapeHtml(t.title)}</div>
          <div class="timeline-time">${formatHumanDate(t.deadline)}</div>
        </div>
        <button class="timeline-check-btn ${t.completed ? 'checked' : ''}" onclick="toggleTaskStatus(${t.id}, ${!t.completed})" title="Tandai Selesai">
          ✓
        </button>
      </div>
    `).join('');
  }

  // Langsung jalankan tanpa nunggu listener yang mungkin sudah lewat
  reloadPageData();
})();
</script>
{% endblock %}
